# One Python environment for the whole repository: `uv sync` from the root.
# The desktop pipeline (pipeline/vantage) is installed as the `vantage` package, so ml/ and
# tools/coreml/ import it as `from vantage.ball_tracker import BallTracker`.
[project]
name = "vantage"
version = "0.1.0"
description = "Racket-sport tracking from a single phone camera: desktop pipeline, detector training, and Core ML tooling."
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.4.0,<9",
    "opencv-python>=4.8,<6",
    "numpy>=1.26,<3",
    # ByteTrack's assignment solver; explicit so offline runs never auto-install it.
    "lap>=0.5.12,<0.6",
    "imageio-ffmpeg>=0.6,<0.7",
]

[project.scripts]
vantage = "vantage.main:main"

[dependency-groups]
# Labeling, evaluation, dataset building, and training (ml/).
ml = ["pyyaml>=6"]
# Core ML export and parity checks (tools/coreml/). Pinned: the shipped model and its
# manifest were exported and validated with exactly these versions.
coreml = [
    "ultralytics==8.4.159",
    "torch==2.14.0",
    "coremltools==9.0",
    "numpy==2.3.5",
]

[tool.uv]
default-groups = ["ml", "coreml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/vantage"]
