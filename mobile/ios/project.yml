# XcodeGen spec kept in sync with VantageMobile.xcodeproj (which is committed and
# does not require XcodeGen). App sources use a folder-synced group: any file added under
# VantageMobile/ is compiled automatically. Shared logic is the local VantageKit package.
name: VantageMobile
options:
  deploymentTarget:
    iOS: '18.0'
packages:
  VantageKit:
    path: VantageKit
settings:
  base:
    SWIFT_VERSION: '5.0'
    PRODUCT_BUNDLE_IDENTIFIER: com.vantage.detectorprototype
targets:
  VantageMobile:
    type: application
    platform: iOS
    sources:
      - path: VantageMobile
        type: syncedFolder
      - path: ../artifacts/yolo26n-1280/VantageDetector.mlpackage
    dependencies:
      - package: VantageKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vantage
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        MARKETING_VERSION: 0.2.0
        TARGETED_DEVICE_FAMILY: '1'
